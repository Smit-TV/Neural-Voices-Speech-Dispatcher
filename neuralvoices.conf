# Note that speech dispatcher might override these values
#
# Default voice
# Will be used if latin and cyrillic voices are not set
voice=ru-RU-DmitryNeural

# Cyrillic voice
#cyrillic-voice=ru-RU-DmitryNeural

# Latin voice
#latin-voice=Microsoft Ava (Natural HD) - English (United States)

# Speech rate
rate=100

# Pitch
pitch=0

# Volume
volume=0

# Debug
# Logging
#log=yes
# Speaks all errors through the espeak synthesizer
# Note: This function requires espeak installed on your system
# Note: This parameter applies only when the log parameter is set
#speak-errors=yes