# Note that speech dispatcher might override these values
# See use-default-pitch
#
# Default voice
# Will be used if latin and cyrillic voices are not set
voice=ru-RU-DmitryNeural

# Cyrillic voice
#cyrillic-voice=ru-RU-DmitryNeural

# Latin voice
#latin-voice=Microsoft Ava (Natural HD) - English (United States)

# Speech rate
rate=100

# Pitch
pitch=0

# Volume
volume=0

# Use default pitch
# when pitch is set to 50% orca and synthesizer comflict so the solution is use default synthesizer pitch
#use-default-pitch=yes

