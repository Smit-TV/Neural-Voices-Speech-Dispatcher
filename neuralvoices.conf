# Module logging
# yes enables logging otherwise not
#enable-logging=yes


# Microsoft libraries logging
# Log level
# values:
# 1 - Verbose
# 2 - info
# 3 - warning
# 4 - error
# any other value disables logging
#microsoft-log-level=4

# Path to microsoft logging file
#path-to-log-file=/home/user/neural_voices_logs.txt

